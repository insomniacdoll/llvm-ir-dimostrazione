name: Build, Test and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-test-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get update
          sudo apt-get install -y bison flex libfl-dev

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew install llvm@20 bison flex

      - name: Configure CMake
        run: |
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            # Use brew --prefix to get correct path regardless of architecture
            export CMAKE_PREFIX_PATH=$(brew --prefix llvm@20)
            export PATH="$(brew --prefix bison)/bin:$PATH"
          else
            # apt.llvm.org installs LLVM 20 under /usr/lib/llvm-20, which is not
            # on CMake's default search path, so find_package(LLVM) needs the hint.
            export CMAKE_PREFIX_PATH="$(llvm-config-20 --prefix 2>/dev/null || echo /usr/lib/llvm-20)"
          fi
          mkdir build
          cd build
          cmake ..

      - name: Build
        run: |
          cd build
          make -j4

      # kscope always exits 0, even when a statement fails to compile, so these
      # steps have to assert on the output. Running the binary alone proves
      # nothing -- a broken codegen path would still "pass".
      - name: Test - Define Function
        run: |
          cd build
          output=$(echo "def foo(a, b) a + b;" | ./src/kscope 2>&1)
          echo "$output"
          echo "$output" | grep -q "Read foo definition"

      - name: Test - Call Function
        run: |
          cd build
          output=$(echo -e "def foo(a, b) a + b;\nfoo(4, 5);" | ./src/kscope 2>&1)
          echo "$output"
          echo "$output" | grep -q "Evaluated to: 9.000000"

      - name: Test - Use Variables
        run: |
          cd build
          # "Read ... definition" is only printed when codegen succeeded.
          output=$(echo "def bar(a) var x = a in x * x;" | ./src/kscope 2>&1)
          echo "$output"
          echo "$output" | grep -q "Read bar definition"

      - name: Test - Conditional Statement
        run: |
          cd build
          output=$(echo -e "def max(a, b) if a < b then b else a;\nmax(3, 7);" | ./src/kscope 2>&1)
          echo "$output"
          echo "$output" | grep -q "Evaluated to: 7.000000"

      - name: Test - Loop
        run: |
          cd build
          # printd() inside the body makes the loop's real execution visible, so
          # this asserts on what the loop computes. Grepping only for
          # "Read test definition" would still pass if the body never ran.
          stdout=$(echo -e "extern printd(x);\ndef test(n) for i = 1, n+1, 1 in printd(i * i);\ntest(3);" | ./src/kscope 2>/dev/null)
          echo "$stdout"
          test "$stdout" = "$(printf '1.000000\n4.000000\n9.000000')"

      - name: Test - External Function Call
        run: |
          cd build
          output=$(echo -e "extern printd(x);\nprintd(42);" | ./src/kscope 2>&1)
          echo "$output"
          echo "$output" | grep -q "42.000000"

      - name: Package binary
        run: |
          cd build/src
          strip kscope || true
          # Extract version from tag (e.g., v0.1 -> 0.1)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # For non-tag runs, use commit SHA or a default version
            VERSION="${GITHUB_SHA:0:7}"
          fi
          ASSET_NAME="kscope-${{ matrix.platform }}-${{ matrix.arch }}-${VERSION}"
          tar -czf kscope.tar.gz kscope
          mv kscope.tar.gz ../../${ASSET_NAME}.tar.gz
          echo "ASSET_NAME=${ASSET_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ASSET_NAME }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
